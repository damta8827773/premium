<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#234535"/>
      <stop offset="100%" stop-color="#122418"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="gemTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#EAB308" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Faceted gem (premium mark) -->
  <g>
    <polygon points="32,14 44,24 38,24" fill="url(#gemTop)"/>
    <polygon points="32,14 20,24 26,24" fill="#FDE68A"/>
    <polygon points="20,24 26,24 32,44 24,24" fill="url(#gem)"/>
    <polygon points="38,24 44,24 40,24 32,44 40,24" fill="#B45309"/>
    <polygon points="26,24 38,24 32,44" fill="url(#gem)"/>
    <polygon points="20,24 14,26 24,24" fill="#FDE68A" fill-opacity="0.9"/>
    <polygon points="44,24 50,26 40,24" fill="#B45309"/>
    <polygon points="14,26 24,24 32,44" fill="url(#gem)" fill-opacity="0.85"/>
    <polygon points="50,26 40,24 32,44" fill="#92400E" fill-opacity="0.85"/>
  </g>
</svg>
